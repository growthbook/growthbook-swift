name: Deploy

on:
  workflow_run:
    workflows: ["CI main"]
    types:
      - completed

jobs:
  release:
    # Only publish what CI main actually released; a failed or cancelled run has no release to point at
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-15
    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'
    - uses: actions/checkout@v3
      with:
        clean: 'true'
        fetch-depth: 0
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.9.7
      with:
        versionSpec: '5.x'
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.9.7
      with:
        useConfigFile: true
        configFilePath: ./.github/gitversion.yml
    - name: Prepare for release
      run:  |
        set -eo pipefail
        export LIB_VERSION=${{ steps.gitversion.outputs.SemVer }}
        pod spec lint --allow-warnings --skip-import-validation
        pod trunk push --allow-warnings --skip-import-validation
      env:
        COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOA_KEY }}
