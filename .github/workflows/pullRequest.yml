name: CI pullRequest

on:
  pull_request:
    branches: [ '**' ]  

jobs:
  build_framework:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v3
      with:
        clean: 'true'
        fetch-depth: 0
    - name: Select Xcode
      run: |
        sudo xcode-select -switch /Applications/Xcode_16.4.app
        sudo xcodebuild -runFirstLaunch
        xcrun simctl list runtimes
    - name: Run Unit Test
      run: ./Scripts/runTest.sh
    - name: Build Framework
      run: ./Scripts/build.sh

  swift6_language_mode:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v3
      with:
        clean: 'true'
    # A separate job on its own toolchain. The build above pins Xcode 16.4 for a reproducible
    # framework; this one tracks latest-stable deliberately, so new concurrency diagnostics show up
    # here as they ship rather than at the next toolchain bump.
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - name: Build in Swift 6 language mode
      run: swift build -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete
