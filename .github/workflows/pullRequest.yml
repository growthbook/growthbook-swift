name: CI pullRequest

on:
  pull_request:
    branches: [ '**' ]  

jobs:
  build_framework:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v3
      with:
        clean: 'true'
        fetch-depth: 0
    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_16.4.app
    - name: Run Unit Test
      run: ./Scripts/runTest.sh
    - name: Build Framework
      run: ./Scripts/build.sh
